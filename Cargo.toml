[workspace]
members = [".", "crates/agent-core", "crates/kernex-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.0", features = ["derive"] }
directories = "6.0.0"
dialoguer = "0.12.0"
getrandom = "0.3.4"
futures-util = "0.3.33"
ignore = "0.4.27"
keyring = "4.1.5"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.19"
termimad = "0.34.1"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8.23"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
url = "2.5.8"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
webbrowser = "1.0.6"
zeroize = "1.8.2"

[package]
name = "kernex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "kernex"

[[bin]]
name = "kernex"
path = "src/main.rs"

[dependencies]
agent-core = { package = "kernex-agent-core", path = "crates/agent-core" }
anyhow.workspace = true
clap.workspace = true
dialoguer.workspace = true
serde_json.workspace = true
termimad.workspace = true
tokio.workspace = true

[profile.release]
lto = "thin"
strip = "symbols"
