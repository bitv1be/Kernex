[workspace]
members = [".", "crates/agent-core", "crates/kernex-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.0", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ignore = "0.4.27"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8.23"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
url = "2.5.8"

[package]
name = "kernex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "kernex"

[[bin]]
name = "kernex"
path = "src/main.rs"

[dependencies]
agent-core = { package = "kernex-agent-core", path = "crates/agent-core" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true

[profile.release]
lto = "thin"
strip = "symbols"
