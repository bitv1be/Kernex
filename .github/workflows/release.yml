name: Release merged pull request

on:
  pull_request_target:
    branches: [master]
    types: [closed]

concurrency:
  group: release-master
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Choose release version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: version
        name: Choose the next semantic version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' Cargo.toml | sed -n '1p')"
          if [[ -z "$manifest_version" ]]; then
            echo "Could not read a semantic workspace version from Cargo.toml" >&2
            exit 1
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n '1p')"
          if [[ -z "$latest_tag" ]]; then
            version="$manifest_version"
          elif [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next_patch="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            version="$(printf '%s\n%s\n' "$manifest_version" "$next_patch" | sort -V | tail -n 1)"
          else
            echo "Latest version tag is not semantic: $latest_tag" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            asset: kernex-*.tar.gz
          - os: macos-latest
            platform: macos-arm64
            asset: kernex-*.tar.gz
          - os: windows-latest
            platform: windows-x86_64
            asset: kernex-*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KERNEX_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      KERNEX_RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release --locked
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package="kernex-$KERNEX_RELEASE_VERSION-$KERNEX_RELEASE_PLATFORM"
          [[ "$(target/release/kernex --version)" == "kernex $KERNEX_RELEASE_VERSION" ]]
          mkdir package
          cp target/release/kernex target/release/kernex-desktop package/
          tar -C package -czf "$package.tar.gz" .
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "kernex-$env:KERNEX_RELEASE_VERSION-$env:KERNEX_RELEASE_PLATFORM"
          $reported = & target/release/kernex.exe --version
          if ($reported -ne "kernex $env:KERNEX_RELEASE_VERSION") {
            throw "Release binary reported unexpected version: $reported"
          }
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item target/release/kernex.exe, target/release/kernex-desktop.exe package/
          Compress-Archive -Path package/* -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kernex-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish ${{ needs.prepare.outputs.tag }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: kernex-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum kernex-* > SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_SHA" \
            --title "Kernex $RELEASE_TAG" \
            --notes "Automatically published after merging pull request #$PR_NUMBER." \
            --generate-notes \
            --fail-on-no-commits
